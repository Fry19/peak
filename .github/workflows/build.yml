name: Build

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: PeakCore tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Run PeakCore tests
        working-directory: PeakCore
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log | xcbeautify --renderer github-actions
          echo "::notice title=XCTest::$(grep -E 'Executed [0-9]+ tests' test.log | tail -1)"

  linux-tests:
    name: PeakCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v5
      - name: Run PeakCore tests
        working-directory: PeakCore
        run: swift test

  app:
    name: Build app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Cache the worldwide base layer
        uses: actions/cache@v4
        with:
          path: Peak/Resources/World.pkbase
          key: base-layer-${{ hashFiles('Tools/fetch_base_layer.sh') }}
      - name: Fetch the worldwide base layer
        # The app builds without it (no view on first launch without a signal), so a
        # missing release only warns here; the release workflow requires it.
        run: sh Tools/fetch_base_layer.sh || echo "::warning::World.pkbase not fetched; the app is built without the base layer"
      - name: Archive for iPhone
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Peak.xcodeproj \
            -scheme Peak \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Peak.xcarchive \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | xcbeautify --renderer github-actions
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Peak.xcarchive/Products/Applications/Peak.app Payload/
          # An ad-hoc signature; sideloading tools replace it with one from your Apple ID.
          codesign --force --sign - Payload/Peak.app
          zip -qry Peak.ipa Payload
      - name: Check the app bundle
        run: |
          APP=Payload/Peak.app
          ls -la "$APP"
          echo "Binary: $(stat -f%z "$APP/Peak") bytes; IPA: $(stat -f%z Peak.ipa) bytes"
          # The terrain download and PeakCore (peak data, alignment) must be in the binary.
          # Release builds are stripped, so look for string literals rather than symbols.
          for text in "copernicus-dem-30m" "overpass-api.de" "not enough distant skyline"; do
            strings "$APP/Peak" | grep -q "$text" || { echo "missing from the binary: $text"; exit 1; }
          done
          # The overlay's lines are drawn by the Metal shaders compiled into this library.
          test -s "$APP/default.metallib" || { echo "missing from the bundle: default.metallib"; exit 1; }
          if [ -s Peak/Resources/World.pkbase ]; then
            cmp -s Peak/Resources/World.pkbase "$APP/World.pkbase" || { echo "World.pkbase fetched but not in the bundle"; exit 1; }
          fi
          plutil -p "$APP/Info.plist" | grep -E "CFBundleIdentifier|CFBundleShortVersionString|NSCameraUsageDescription|NSLocationWhenInUseUsageDescription"
      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          # Uploaded as is, not zipped: the download is Peak.ipa itself.
          path: Peak.ipa
          archive: false

  bench:
    name: Skyline matching benchmark
    runs-on: macos-15
    env:
      LAT: "45.9837"
      LON: "7.7856"
      SMOKIES_LAT: "35.654"
      SMOKIES_LON: "-83.444"
    steps:
      - uses: actions/checkout@v5

      - name: Cache DEM tiles
        uses: actions/cache@v4
        with:
          path: DEM
          key: dem-gornergrat-100km-${{ hashFiles('Tools/fetch_dem.py') }}

      # The second site: forested, hazy, lower relief. Its own cache, so the first one's
      # key (and the tiles already saved under it) stay as they are.
      - name: Cache Smokies DEM tiles
        uses: actions/cache@v4
        with:
          path: DEM-smokies
          key: dem-smokies-100km-${{ hashFiles('Tools/fetch_dem.py') }}

      # OpenStreetMap peaks for raising summits as the app does. Kept once fetched, so the
      # harder benchmark matches against the same summits on every run. Saved under a new
      # key each run, so a site missing from one run's cache is added once it's fetched.
      - name: Cache peaks
        uses: actions/cache@v4
        with:
          path: peaks
          key: bench-peaks-v1-${{ github.run_id }}
          restore-keys: bench-peaks-v1-

      - name: Fetch Copernicus GLO-30 tiles
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r Tools/requirements.txt
          .venv/bin/python Tools/fetch_dem.py --lat "$LAT" --lon "$LON" --radius-km 100 --out DEM
          .venv/bin/python Tools/fetch_dem.py --lat "$SMOKIES_LAT" --lon "$SMOKIES_LON" --radius-km 100 --out DEM-smokies

      - name: Fetch peaks
        run: |
          mkdir -p peaks
          UA="Peak/0.8 CI (github.com/Fry19/peak)"
          # Named peaks within about 80 km (the app's range), from the first server that answers.
          fetch() {
            [ -s "peaks/$1.json" ] && grep -q '"elements"' "peaks/$1.json" && return 0
            q="[out:json][timeout:120];node[\"natural\"~\"^(peak|volcano)\$\"][\"name\"]($2);out body;"
            for server in https://overpass-api.de https://overpass.kumi.systems https://overpass.private.coffee https://maps.mail.ru/osm/tools/overpass; do
              if curl -sSf -m 150 -A "$UA" --data-urlencode "data=$q" "$server/api/interpreter" -o "peaks/$1.part" \
                 && grep -q '"elements"' "peaks/$1.part" && ! grep -q '"remark": *"[^"]*[Ee]rror' "peaks/$1.part"; then
                mv "peaks/$1.part" "peaks/$1.json"
                return 0
              fi
            done
            rm -f "peaks/$1.part"
            echo "::warning title=Peaks::couldn't fetch peaks for $1; its harder benchmark runs without summit cones"
          }
          fetch gornergrat 45.26,6.75,46.70,8.82
          fetch smokies 34.93,-84.33,36.37,-82.56
          ls -la peaks

      - name: Build peakbench
        working-directory: PeakCore
        run: |
          set -o pipefail
          swift build -c release 2>&1 | xcbeautify --renderer github-actions

      - name: Run benchmark
        run: |
          B=PeakCore/.build/release/peakbench
          mkdir -p out/frames
          {
            echo "## Heading error before and after skyline matching"
            echo "Synthetic photos of the real terrain within 3 km of Gornergrat, Zermatt. Compass error σ ≈ 8°, GPS error up to 15 m, random clouds and trees."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          $B bench --dem DEM --lat "$LAT" --lon "$LON" --runs 30 --mode arkit --save out/frames --markdown arkit.md
          $B bench --dem DEM --lat "$LAT" --lon "$LON" --runs 30 --mode photo --seed 2 --markdown photo.md
          $B bench --dem DEM --lat "$LAT" --lon "$LON" --runs 30 --aim any --seed 3 --markdown any.md
          cat arkit.md photo.md any.md >> "$GITHUB_STEP_SUMMARY"

      - name: Cache the worldwide base layer (benchmark)
        uses: actions/cache@v4
        with:
          path: Peak/Resources/World.pkbase
          key: base-layer-${{ hashFiles('Tools/fetch_base_layer.sh') }}
      - name: Base layer vs full DEM
        run: |
          if sh Tools/fetch_base_layer.sh; then
            B=PeakCore/.build/release/peakbench
            $B base --base Peak/Resources/World.pkbase --dem DEM --lat "$LAT" --lon "$LON" --markdown base.md
            $B bench --dem DEM --lat "$LAT" --lon "$LON" --runs 30 --match base --base Peak/Resources/World.pkbase --markdown base-match.md
            { cat base.md; echo; echo "Matching against the base layer alone:"; echo; cat base-match.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::World.pkbase not fetched; skipping the base layer comparison"
          fi

      - name: Run harder benchmark
        run: |
          B=PeakCore/.build/release/peakbench
          peaks() { [ -s "peaks/$1.json" ] && echo "--peaks peaks/$1.json"; }
          {
            echo "## Harder synthetic benchmark"
            echo "The same runs, but the photo is rendered from perturbed terrain (blurred, ±5 m noise, shifted 15 m) and matched against the app's 30/60/120 m terrain with summit cones; the camera has lens distortion and rolling shutter. Then the Great Smoky Mountains: forested, hazy, lower relief."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          $B bench --dem DEM --lat "$LAT" --lon "$LON" --runs 30 --harder $(peaks gornergrat) --markdown hard-arkit.md
          $B bench --dem DEM --lat "$LAT" --lon "$LON" --runs 30 --harder $(peaks gornergrat) --mode photo --seed 2 --markdown hard-photo.md
          $B bench --dem DEM-smokies --lat "$SMOKIES_LAT" --lon "$SMOKIES_LON" --runs 30 --scene smokies --markdown smokies.md
          $B bench --dem DEM-smokies --lat "$SMOKIES_LAT" --lon "$SMOKIES_LON" --runs 30 --scene smokies --harder $(peaks smokies) --markdown smokies-hard.md
          for f in hard-arkit hard-photo smokies smokies-hard; do cat $f.md; echo; done >> "$GITHUB_STEP_SUMMARY"

      - name: Matterhorn example
        run: |
          B=PeakCore/.build/release/peakbench
          $B horizon --dem DEM --lat "$LAT" --lon "$LON" --image out/gornergrat-panorama.png
          $B synth --dem DEM --lat "$LAT" --lon "$LON" --heading 262 --pitch 3 --roll 1 --compass-error 8 --out out/matterhorn
          $B align out/matterhorn.json --dem DEM --debug out/matterhorn-aligned.png

      - name: Live data (hikes, facts, terrain blocks)
        run: |
          B=PeakCore/.build/release/peakbench
          mkdir -p live
          UA="Peak/0.8 CI (github.com/Fry19/peak)"
          {
            echo "## Live data checks"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          # Terrain: full-detail blocks decoded one at a time must match the whole image.
          S=Copernicus_DSM_COG_10_N45_00_E007_00_DEM
          curl -sSf -o live/N45E007.tif "https://copernicus-dem-30m.s3.amazonaws.com/$S/$S.tif"
          $B geotiff live/N45E007.tif --level 0 --blocks | tee live/blocks.txt
          $B geotiff live/N45E007.tif --level 1 --blocks | tee -a live/blocks.txt
          rm live/N45E007.tif
          # Ask Overpass a query (file $1) and save the answer in $2, trying the servers the
          # app uses in turn; an answer reporting a failed query counts as none.
          overpass() {
            for server in https://overpass-api.de https://overpass.openstreetmap.fr https://overpass.kumi.systems https://overpass.private.coffee https://maps.mail.ru/osm/tools/overpass; do
              if curl -sSf -m "${3:-90}" -A "$UA" --data-urlencode "data@$1" "$server/api/interpreter" -o "$2" \
                 && ! grep -q '"remark": *"[^"]*[Ee]rror' "$2"; then
                echo "From $server"
                return 0
              fi
            done
            return 1
          }
          # Hikes near the Matterhorn, with the app's own query; in sight from Gornergrat.
          $B trails --query --lat 45.9763 --lon 7.6586 > live/trails-query.txt
          if overpass live/trails-query.txt live/matterhorn-trails.json > live/trails.txt; then
            cat live/trails.txt
            $B trails live/matterhorn-trails.json --lat 45.9763 --lon 7.6586 --dem DEM --from-lat "$LAT" --from-lon "$LON" | tee -a live/trails.txt
          else
            echo "Overpass unavailable; skipped" | tee live/trails.txt
          fi
          # Hikes near Mount Le Conte in the Smokies, and everything an offline area of 30 km
          # around it saves (with the hikes for peaks near its edge).
          $B trails --query --lat 35.6544 --lon -83.4383 > live/smokies-query.txt
          if overpass live/smokies-query.txt live/leconte-trails.json > live/smokies.txt; then
            $B trails live/leconte-trails.json --lat 35.6544 --lon -83.4383 > live/leconte.txt
            head -25 live/leconte.txt | tee -a live/smokies.txt
          else
            echo "Overpass unavailable; skipped" | tee live/smokies.txt
          fi
          $B trails --query --area 38000 --lat 35.6544 --lon -83.4383 > live/area-query.txt
          START=$(date +%s)
          if overpass live/area-query.txt live/area-trails.json 200 > live/area.txt; then
            echo "$(( $(date +%s) - START )) s" >> live/area.txt
            $B trails live/area-trails.json --lat 35.6544 --lon -83.4383 > live/area-list.txt
            head -3 live/area-list.txt | tee -a live/area.txt
          else
            echo "Overpass unavailable; skipped" | tee live/area.txt
          fi
          # Facts about the Matterhorn from Wikidata and Wikipedia.
          W="https://www.wikidata.org/w/api.php?action=wbgetentities&format=json"
          if curl -sSf -A "$UA" -o live/q1374.json "$W&ids=Q1374&props=claims%7Cdescriptions%7Csitelinks&languages=en"; then
            IDS=$($B facts live/q1374.json --id Q1374 | sed -n 's/^linked ids: //p' | sed 's/|/%7C/g')
            curl -sSf -A "$UA" -o live/labels.json "$W&ids=$IDS&props=labels&languages=en" || echo '{"entities":{}}' > live/labels.json
            curl -sSf -A "$UA" -o live/summary.json "https://en.wikipedia.org/api/rest_v1/page/summary/Matterhorn" || echo '{}' > live/summary.json
            $B facts live/q1374.json --id Q1374 --labels live/labels.json --summary live/summary.json | tee live/facts.txt
          else
            echo "Wikidata unavailable; skipped" | tee live/facts.txt
          fi
          {
            echo '```'
            cat live/blocks.txt
            echo
            head -40 live/trails.txt
            echo
            cat live/smokies.txt
            echo
            cat live/area.txt
            echo
            cat live/facts.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: skyline-matching
          path: |
            out
            live
